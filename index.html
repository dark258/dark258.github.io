                    init: function() {
                        var body = document.body;
                        body.classList.remove('is-loading');
                        body.classList.add('is-playing');
                        setTimeout(function() {
                            body.classList.remove('is-playing');
                            body.classList.add('is-ready');
                        }, 1875);
                    }
                }
                  , trigger = function(type, element) {
                    element.dispatchEvent(new Event(type));
                }
                  , cssRules = function(selectortext) {
                    var ss = document.styleSheets, a = [], f = function(s) {
                        var r = s.cssRules || s.rules, i;
                        if (r)
                            for (i = 0; i < r.length; i++) {
                                if (r[i].type === CSSRule.STYLE_RULE && r[i].selectorText == selectortext)
                                    a.push(r[i]);
                                else if (r[i].type === CSSRule.SUPPORTS_RULE || r[i].type === CSSRule.MEDIA_RULE)
                                    f(r[i]);
                            }
                    }, i;
                    for (i = 0; i < ss.length; i++)
                        f(ss[i]);
                    return a;
                }
                  , escapeHtml = function(s) {
                    if (s === '' || s === null || s === undefined)
                        return '';

                    var a = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;',
                    };

                    s = s.replace(/[&<>"']/g, function(x) {
                        return a[x];
                    });

                    return s;
                };

                var onvisible = {
                    add: function(selector, settings) {
                        var style = settings.style
                          , speed = settings.speed
                          , intensity = settings.intensity
                          , threshold = settings.threshold
                          , delay = settings.delay
                          , replay = settings.replay
                          , stagger = settings.stagger
                          , staggerOrder = settings.staggerOrder
                          , staggerSelector = settings.staggerSelector
                          , state = settings.state
                          , handler = settings.handler
                          , enter = settings.enter
                          , leave = settings.leave
                          , target = settings.target
                          , x = $(selector);

                        x.forEach(function(e) {
                            var parent = (target) ? e.closest(target) : e;

                            if (!parent)
                                return;

                            var element = {
                                element: e,
                                parent: parent,
                                initial: false,
                                enter: enter,
                                leave: leave,
                            };

                            var io = new IntersectionObserver(function(entries) {
                                entries.forEach(function(entry) {
                                    if (entry.isIntersecting) {
                                        if (element.enter)
                                            element.enter();

                                        element.initial = true;
                                    } else {
                                        if (element.initial && element.leave)
                                            element.leave();
                                    }
                                });
                            }
                            ,{
                                threshold: threshold
                            });

                            io.observe(parent);
                        });
                    },
                    splitWords: function(x) {
                        var textNode = x.childNodes[0]
                          , text = textNode.nodeValue
                          , words = text.split(' ')
                          , w = '';

                        words.forEach(function(word) {
                            w += '<span>' + escapeHtml(word) + '</span> ';
                        });

                        w = w.trim();

                        if (words.length > 1) {
                            var w2 = document.createElement('text-node');
                            w2.innerHTML = w;
                            x.replaceWith(w2);
                            while (w2.childNodes.length > 0) {
                                w2.parentNode.insertBefore(w2.childNodes[0], w2);
                            }
                            w2.parentNode.removeChild(w2);
                        } else {
                            var w = document.createElement('text-node');
                            w.innerHTML = s;
                            x.replaceWith(w);
                            while (w.childNodes.length > 0) {
                                w.parentNode.insertBefore(w.childNodes[0], w);
                            }
                            w.parentNode.removeChild(w);
                        }
                    },
                };
                onvisible.add('.text-component.style-1', {
                    style: 'zoom-in',
                    speed: 1875,
                    intensity: 1,
                    threshold: 3,
                    delay: 0,
                    replay: false
                });
                onvisible.add('.text-component.style-3', {
                    style: 'fade-up',
                    speed: 1125,
                    intensity: 3,
                    threshold: 3,
                    delay: 0,
                    replay: false
                });
                onvisible.add('.icons-component.style-1', {
                    style: 'fade-up',
                    speed: 1000,
                    intensity: 5,
                    threshold: 3,
                    delay: 125,
                    stagger: 125,
                    staggerOrder: 'reverse',
                    staggerSelector: ':scope > li',
                    replay: false
                });
                ready.run();
            }
            )();
        </script>
    </body>
</html>
